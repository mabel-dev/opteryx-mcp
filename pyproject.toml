[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opteryx-mcp"
dynamic = ["version"]
description = "Connect MCP clients such as Claude Desktop to the Opteryx data platform"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = []
keywords = ["opteryx", "mcp", "model context protocol", "claude"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://opteryx.app"
Source = "https://github.com/mabel-dev/opteryx-mcp"

[project.scripts]
opteryx-mcp = "opteryx_mcp.cli:main"

[tool.setuptools]
packages = ["opteryx_mcp"]

[tool.setuptools.dynamic]
version = { attr = "opteryx_mcp.__version__" }

[tool.ruff]
line-length = 100
indent-width = 4
target-version = 'py39'

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]

[tool.ruff.lint.isort]
force-single-line = true

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 100
